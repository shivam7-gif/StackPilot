version: "3.9"

services:
  # ── Next.js Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./apps/web/app
      dockerfile: Dockerfile
      target: runner
    container_name: stackpilot-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stackpilot-net

  # ── Express Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./apps/api/backend
      dockerfile: Dockerfile
      target: runner
    container_name: stackpilot-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist scaffolded projects outside the container
      - projects-data:/app/projects
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - stackpilot-net

networks:
  stackpilot-net:
    driver: bridge

volumes:
  projects-data:
    driver: local
