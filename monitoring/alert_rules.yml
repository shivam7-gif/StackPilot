groups:
  - name: stackpilot_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"

      - alert: HighHttp5xxErrorRate
        expr: (sum(rate(stackpilot_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(stackpilot_http_requests_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate (>5%)"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(stackpilot_http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency is above 1 second"

      - alert: HighCpuUsage
        expr: (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU is above 85%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Host memory is above 90%"
