# ==============================================================================
# StackPilot - Prometheus Configuration
# File: monitoring/prometheus.yml
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    monitor: 'stackpilot-monitor'
    cluster: 'stackpilot-cluster'
    environment: 'development'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'stackpilot-backend'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:5000'
          - 'localhost:5000'
        labels:
          app: 'stackpilot'
          tier: 'backend'
          service: 'backend-api'

  - job_name: 'stackpilot-frontend'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
          - 'localhost:3000'
        labels:
          app: 'stackpilot'
          tier: 'frontend'

  - job_name: 'stackpilot-ai-engine'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:8000'
          - 'localhost:8000'
        labels:
          app: 'stackpilot'
          tier: 'ai-engine'

  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'node-exporter:9100'
          - 'localhost:9100'

  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'cadvisor:8080'
          - 'localhost:8080'
