name: Production Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Next.js Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web/app
          file: ./apps/web/app/Dockerfile.prod
          push: false
          tags: stackpilot/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Express Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api/backend
          file: ./apps/api/backend/Dockerfile.prod
          push: false
          tags: stackpilot/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
