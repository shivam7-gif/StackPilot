name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel any in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

# ─────────────────────────────────────────────────────────────────
# JOB 1 — Lint & Type-check: Frontend (Next.js)
# ─────────────────────────────────────────────────────────────────
jobs:
  frontend-ci:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check (tsc)
        run: npx tsc --noEmit
        continue-on-error: true # warn only — tsc may be strict

      - name: Build Next.js app
        run: npm run build
        env:
          # Silence telemetry in CI
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/app/.next
          retention-days: 3

# ─────────────────────────────────────────────────────────────────
# JOB 2 — Lint & Type-check: Backend (Express + TypeScript)
# ─────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend — Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/api/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        # Will print "no test specified" — update when tests are added
        continue-on-error: true

# ─────────────────────────────────────────────────────────────────
# JOB 3 — Security: Audit both apps for known vulnerabilities
# ─────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend dependencies
        working-directory: apps/web/app
        run: |
          npm ci --prefer-offline
          npm audit --audit-level=high
        continue-on-error: true

      - name: Audit backend dependencies
        working-directory: apps/api/backend
        run: |
          npm ci --prefer-offline
          npm audit --audit-level=high
        continue-on-error: true

# ─────────────────────────────────────────────────────────────────
# JOB 4 — Deploy (only on push to main after CI passes)
# ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    # Only deploy on direct push to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Optional: Deploy frontend to Vercel ──────────────────
      - name: Deploy Frontend to Vercel
        if: vars.VERCEL_TOKEN != ''
        working-directory: apps/web/app
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

      # ── Optional: Deploy backend via SSH ────────────────────
      - name: Deploy Backend via SSH
        if: secrets.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/stackpilot/backend
            git pull origin main
            npm ci --prefer-offline
            pm2 restart stackpilot-api || pm2 start npm --name stackpilot-api -- start
        continue-on-error: true

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | Deployed via Vercel |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | Deployed via SSH/PM2 |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit   | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch   | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
